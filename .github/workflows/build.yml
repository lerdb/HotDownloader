name: Build

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ---------- 桌面端构建 ----------
  build:
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
          - macos-26-intel
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target/release/deps
            src-tauri/target/release/build
            src-tauri/target/release/.fingerprint
          key: cargo-${{ matrix.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: cargo-${{ matrix.os }}-

      - name: Install Linux dependencies
        # https://tauri.app/start/prerequisites/#linux
        if: runner.os == 'Linux'
        run: |
          sudo apt update
          sudo apt install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 60
          max_attempts: 3
          command: npm run tauri build
        env:
          TAURI_BUNDLER_DMG_IGNORE_CI: false

      # 按操作系统分别上传
      - name: Upload Linux bundles
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: bundle-${{ matrix.os }}
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: warn

      - name: Upload Windows bundles
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: bundle-${{ matrix.os }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn

      - name: Upload macOS bundles
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: bundle-${{ matrix.os }}
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: warn

  # ---------- Android 构建 ----------
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Setup JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK components (Platform 36, Build-Tools 36, NDK 28.2.13676358)
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"
          echo "NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> $GITHUB_ENV

      - name: Cache Rust dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target/release/deps
            src-tauri/target/release/build
            src-tauri/target/release/.fingerprint
          key: android-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: android-cargo-

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('src-tauri/gen/android/**/*.gradle*', 'src-tauri/gen/android/**/*.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Install frontend dependencies
        run: npm ci

      - name: Decode keystore from secret
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > $RUNNER_TEMP/keystore.jks

      - name: Generate keystore.properties
        run: |
          cat > src-tauri/gen/android/keystore.properties << EOF
          storeFile=$RUNNER_TEMP/keystore.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Build release APK
        run: npm run tauri android build -- --apk

      - name: Build debug APK
        run: npm run tauri android build -- --apk --debug

      - name: Upload release APKs
        uses: actions/upload-artifact@v7
        with:
          name: android-apk-release
          path: src-tauri/gen/android/app/build/outputs/apk/**/release/*.apk
          if-no-files-found: error

      - name: Upload debug APKs
        uses: actions/upload-artifact@v7
        with:
          name: android-apk-debug
          path: src-tauri/gen/android/app/build/outputs/apk/**/debug/*.apk
          if-no-files-found: error

  # ---------- 创建 Release（仅 tag 触发，且只执行一次） ----------
  release:
    needs: [build, build-android]   # 等待所有构建完成
    if: github.ref_type == 'tag'    # 仅标签推送时运行
    runs-on: ubuntu-latest
    permissions:
      contents: write               # 仅此 job 需要写权限
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0            # 获取全部历史，否则 git-cliff 可能找不到旧 tag
          submodules: recursive

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets      # 下载到该目录
          merge-multiple: true      # 合并所有 artifact，不保留 artifact 名称子目录

      - name: Install git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff@2.14.1

      - name: Generate release notes
        run: git-cliff --latest -o release_notes.md

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          name: Release ${{ github.ref_name }}
          body_path: release_notes.md   # 使用文件内容作为 Release 说明
          draft: false
          prerelease: false
          files: |
            release-assets/**/*.AppImage
            release-assets/**/*.deb
            release-assets/**/*.rpm
            release-assets/**/*.exe
            release-assets/**/*.msi
            release-assets/**/*.dmg
            release-assets/**/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}