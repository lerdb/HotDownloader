[package]
name = "hotdownloader-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.77.2"
license = "Apache-2.0"
description = "HotDownloader 共享下载核心，提供任务调度、文件操作和 HTTP 传输"

[dependencies]
async-tungstenite = { version = "0.32.1", features = ["tokio-runtime", "tokio-rustls-webpki-roots"] }
bytes = "1.12.1"
futures-util = "0.3.33"
base64 = "0.23.1"
encoding_rs = "0.8.35"
flate2 = "1.1.9"
log = "0.4"
lofty = "0.22.2"
once_cell = "1.21.4"
rand = "0.9.5"
regex = "1.13.1"
reqwest = { version = "0.12", features = ["stream", "json", "rustls-tls", "gzip"], default-features = false }
rumqttc = "0.25.1"
rustls = { version = "0.23.43", features = ["ring"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.53.1", features = ["fs", "macros", "rt", "sync", "time"] }
tokio-util = "0.7.19"
umc_qmc = { path = "../../libs/um_crypto/um_crypto/qmc" }
