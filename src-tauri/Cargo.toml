[package]
name = "hotdownloader"
version = "1.3.3"
description = "跨平台音乐下载器"
authors = ["lerdb"]
license = "Apache-2.0"
repository = "https://github.com/lerdb/HotDownloader"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
hotdownloader-core = { path = "../crates/hotdownloader-core" }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["tray-icon"] }
tauri-plugin-log = "2"
reqwest = { version = "0.12", features = [
    "stream",
    "json",
    "rustls-tls",
    "gzip",
], default-features = false }
tauri-plugin-store = "2.4.4"
tauri-plugin-dialog = "2.7.2"
dirs = "6.0.0"
tokio = "1.53.1"
tokio-util = "0.7.19"
futures-util = "0.3.33"
open = "5.4.1"
once_cell = "1.21.4"
tauri-plugin-opener = "2.5.4"
tauri-plugin-android-fs = "29.0.0"
rand = "0.9.5"
tauri-plugin-os = "2.3.2"
tauri-plugin-notification = "2.3.3"
tauri-plugin-safe-area-insets-css-edge = "0.2.1"

[profile.dev]
incremental = true # 以较小的步骤编译您的二进制文件。

[profile.release]
codegen-units = 1 # 允许 LLVM 执行更好的优化。
lto = true        # 启用链接时优化。
opt-level = "s"   # 优先考虑小的二进制文件大小。如果您更喜欢速度，请使用 `3`。
# 保留默认的 unwind 策略。下载任务或第三方库触发 panic 时，
# 任务级处理会呈现该任务的错误提示，应用可继续提供服务。
strip = true      # 确保移除调试符号。
